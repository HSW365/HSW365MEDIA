server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|gif|ico|mp4|webm|woff2?|ttf|json)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
