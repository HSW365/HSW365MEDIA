<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230a0a0f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%2322d3ee%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<title>Sign in - SYNC365</title>
</head>
<body>
<div class="auth">
  <aside class="auth-art">
    <a class="logo" href="/"><i></i>SYNC<b>365</b></a>
    <div><div class="eyebrow" style="margin-bottom:22px">Flat monthly / no credits</div><h2 class="display">Any face.<br>Any voice.<br><span class="grad">Your number.</span></h2></div>
    <span class="mono">An HSW365 Media product</span>
  </aside>
  <main class="auth-form"><div class="auth-card">
    <a class="logo" href="/" style="margin-bottom:34px"><i></i>SYNC<b>365</b></a>
    <h1 class="display" id="title">Sign in</h1>
    <p class="sub" id="sub">Welcome back.</p>
    <div class="alert" id="err" hidden role="alert"></div>
    <form id="form" novalidate>
      <div class="field" id="nameField" hidden><label for="name">Name</label><input class="input" id="name" autocomplete="name" placeholder="Your name"></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" placeholder="At least 8 characters" required></div>
      <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
    </form>
    <p class="alt" id="alt"></p>
  </div></main>
</div>
<script type="module">
import { api, $ } from '/js/common.js';
const signup = location.pathname === '/signup';
const plan = new URLSearchParams(location.search).get('plan');
const q = plan ? `?plan=${encodeURIComponent(plan)}` : '';
const dest = plan ? `/app?tab=plan&plan=${encodeURIComponent(plan)}` : '/app';
try { await api('/api/me'); location.replace(dest); } catch {}
if (signup) {
  document.title = 'Create account - SYNC365';
  $('#title').textContent = 'Create account';
  $('#sub').textContent = plan ? 'Create your account, then check out.' : 'Takes about ten seconds.';
  $('#nameField').hidden = false;
  $('#submit').textContent = 'Create account';
  $('#password').autocomplete = 'new-password';
  $('#alt').innerHTML = `Already have an account? <a class="link" href="/login${q}">Sign in</a><br><span style="font-size:13px;color:var(--dim)">By creating an account you agree to the <a class="link" href="/terms">terms and acceptable use</a>.</span>`;
} else {
  $('#password').autocomplete = 'current-password';
  $('#alt').innerHTML = `New here? <a class="link" href="/signup${q}">Create an account</a>`;
}
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#submit'); const err = $('#err');
  err.hidden = true; btn.disabled = true;
  try {
    await api(signup ? '/api/auth/signup' : '/api/auth/login', { method: 'POST', body: { name: $('#name').value, email: $('#email').value, password: $('#password').value } });
    location.href = dest;
  } catch (ex) { err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
});
</script>
</body>
</html>
