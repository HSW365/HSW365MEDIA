    if (!/\S+@\S+\.\S+/.test(d.email || "")) { $("s4Err").textContent = "Enter a valid email."; return; }
    if ((o4.password || "").length < 8) { $("s4Err").textContent = "Password must be at least 8 characters."; return; }
    if ((d.terms_signed_name || "").toLowerCase().replace(/\s+/g, " ") !== (d.full_name || "").toLowerCase().replace(/\s+/g, " ")) { $("s4Err").textContent = "Type your full name exactly as you entered it: " + d.full_name; return; }
    busy($("s4B"), true, "Create account");
    var meta = { app: "nil365", role: su.role, terms_version: TERMS_VERSION };
    ["full_name", "school", "level", "sport", "position", "grad_year", "state", "city", "is_minor", "guardian_name", "guardian_email", "guardian_consent", "instagram", "tiktok", "youtube", "x_handle", "followers", "niches", "bio", "company", "website", "industry", "budget_range", "terms_signed_name"].forEach(function (k) { if (d[k] !== undefined && d[k] !== "") meta[k] = d[k]; });
    var j4 = {};
    try {
      var r4 = await fetch(SB_URL + "/functions/v1/nil-signup", { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }, body: JSON.stringify({ email: d.email, password: o4.password, meta: meta }) });
      j4 = await r4.json().catch(function () { return {}; });
      if (!r4.ok) throw new Error(j4.error || "Could not create your account.");
      var li = await sb.auth.signInWithPassword({ email: d.email, password: o4.password });
      if (li.error) throw li.error;
    } catch (x) { busy($("s4B"), false, "Create account"); $("s4Err").textContent = x.message; return; }
    S.signup = { step: 1, role: null, data: {} };
    await loadMe(); toast("Welcome to NIL365."); go("#/membership");
    return;
  }
  if (f.id === "applyF") {
    if (!requireMember()) return;
    busy($("applyB"), true, "Apply");
    var id = location.hash.split("/")[2];
    var ra = await sb.from("nil_applications").insert({ deal_id: id, applicant_id: S.me.id, pitch: $("pitch").value.trim() });
    busy($("applyB"), false, "Apply");
    if (ra.error) return toast(/row-level/.test(ra.error.message) ? "Activate your membership to apply." : ra.error.message, true);
    toast("Applied. The brand will review your profile."); render(); return;
  }
  if (f.id === "postF") {
    if (!isAdmin() && !requireMember()) return;
    var p = readForm(f); $("postErr").textContent = "";
    var roles = [].slice.call(f.querySelectorAll("[name=eligible_roles]:checked")).map(function (c) { return c.value; });
    if (!p.title || !p.compensation || !p.description) { $("postErr").textContent = "Title, compensation and description are required."; return; }
    if (!roles.length) { $("postErr").textContent = "Pick who can apply."; return; }
    busy($("postB"), true, "Publish deal");
    var rp = await sb.from("nil_deals").insert({ brand_id: S.me.id, title: p.title, category: p.category, compensation: p.compensation, description: p.description, deliverables: p.deliverables || "",
      eligible_roles: roles, min_followers: +p.min_followers || 0, state: (p.state || "").toUpperCase() || null, deadline: p.deadline || null }).select("id").single();
    busy($("postB"), false, "Publish deal");
    if (rp.error) { $("postErr").textContent = /row-level/.test(rp.error.message) ? "Activate your brand membership to post deals." : rp.error.message; return; }
    toast("Deal published."); go("#/deal/" + rp.data.id); return;
  }
  if (f.id === "profF") {
    var pr = readForm(f); ["grad_year", "followers"].forEach(function (k) { if (k in pr) pr[k] = pr[k] === "" ? null : +pr[k]; });
    if (pr.state) pr.state = pr.state.toUpperCase();
    busy($("profB"), true, "Save profile");
    var ru = await sb.from("nil_profiles").update(pr).eq("id", S.me.id);
    busy($("profB"), false, "Save profile");
    if (ru.error) { $("profErr").textContent = ru.error.message; return; }
    await loadMe(); toast("Profile saved."); return;
  }
  if (f.id === "resetF") {
    var rr = await sb.auth.updateUser({ password: $("nP").value });
    if (rr.error) { $("rErr").textContent = rr.error.message; return; }
    toast("Password updated."); await loadMe(); go("#/app"); return;
  }
});

function bindSign(isGuardian, key) {
  var get = bindPad(); if (!get) return;
  $("sgB").onclick = async function () {
    var name = $("sgName").value.trim(), img = get(); $("sgErr").textContent = "";
    if (!name) { $("sgErr").textContent = "Type your full legal name."; return; }
    if (!img) { $("sgErr").textContent = "Draw your signature in the box."; return; }
    busy($("sgB"), true, "Sign");
    var r = isGuardian ? await sb.rpc("nil_guardian_sign", { p_token: key, p_name: name, p_image: img }) : await sb.rpc("nil_sign_agreement", { p_id: key, p_name: name, p_image: img });
    if (r.error) { busy($("sgB"), false, "Sign"); $("sgErr").textContent = r.error.message; return; }
    toast("Signed."); render();
  };
}

/* ---------- router ---------- */
var rendering = 0;
async function render() {
  var my = ++rendering;
  var parts = location.hash.replace(/^#\/?/, "").split("/");
  var name = parts[0] || "", arg = parts[1];
  var fn = V[name] || V[""];
  chrome();
  var html;
  try { html = await fn(arg); } catch (x) { html = '<div class="page"><div class="wrap"><div class="card empty"><b>Something went wrong</b>' + esc(x.message || x) + "</div></div></div>"; }
  if (my !== rendering) return;
  if (html) $("view").innerHTML = html;
  $("links").classList.remove("open");
  if (name === "agreement" && $("pad")) bindSign(false, arg);
  if (name === "guardian" && $("pad")) bindSign(true, arg);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
sb.auth.onAuthStateChange(function (ev) { if (ev === "PASSWORD_RECOVERY") { location.hash = "#/reset"; } });
loadMe().then(render);
})();
</script>
