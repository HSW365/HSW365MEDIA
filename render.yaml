services:
  - type: web
    name: sync365
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - { key: OWNER_PASSWORD, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: DB_SCHEMA, sync: false }
